<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IIDZII POS" />
    <meta name="description" content="IIDZII POS - نظام إدارة المبيعات الذكي" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />

    <!-- Arabic Font - محلي لا يحتاج إنترنت -->
    <style>
      @font-face {
        font-family: 'Cairo';
        src: url('./fonts/Ubuntu Arabic Regular.otf') format('opentype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Cairo';
        src: url('./fonts/Ubuntu Arabic Regular.otf') format('opentype');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Cairo';
        src: url('./fonts/Ubuntu Arabic Regular.otf') format('opentype');
        font-weight: 900;
        font-display: swap;
      }

      /* منع الاختيار غير المقصود على الهاتف */
      * { -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        font-family: 'Cairo', 'Segoe UI', sans-serif;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /* Safe area للهواتف ذات الشق */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root { height: 100%; }
      html { height: 100%; }
    </style>

    <title>IIDZII POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>

    <!-- تسجيل Service Worker للعمل بدون إنترنت -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
